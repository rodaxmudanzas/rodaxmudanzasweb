<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reserva confirmada | RODAX</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

body{

font-family:Inter,sans-serif;

background:#f8fafc;

}

.card{

background:white;

border-radius:20px;

box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.valor{

font-weight:700;

color:#111827;

}

.titulo{

font-size:14px;

color:#6b7280;

}

</style>

</head>

<body>

<div class="min-h-screen flex items-center justify-center p-6">

<div class="card max-w-2xl w-full p-10">

<div class="text-center">

<div class="text-6xl mb-4">
✅
</div>

<h1 class="text-5xl font-extrabold text-green-600 text-center">

    Pago realizado correctamente

</h1>

<p class="text-center text-gray-600 mt-4 text-lg">

    Tu reserva ha quedado registrada correctamente.
    En breve asignaremos un transportista.

</p>

</div>

<hr class="my-8">

<div class="space-y-6">

<div>

<div class="titulo">🧾 Número de reserva</div>

<div id="numeroReserva" class="valor text-xl">
Cargando...
</div>

</div>

    <div>
        <p class="text-sm text-gray-500">

🟢 Estado

</p>
        <p id="estado" class="font-semibold"></p>
    </div>

    <div>
        <p class="text-sm text-gray-500">

👤 Cliente

</p>
        <p id="nombre" class="font-semibold"></p>
    </div>

    <div>
        <p class="text-sm text-gray-500">

📅 Fecha de la mudanza

</p>
        <p id="fecha" class="font-semibold"></p>
    </div>

    <hr class="my-6 border-gray-200">

    <div>
        <p class="text-sm text-gray-500">

🚚 Ruta

</p>

        <p id="ruta" class="leading-8"></p>
    </div>

    <hr class="my-6 border-gray-200">

    <p class="text-lg font-bold text-gray-700 mb-4">

💶 Resumen económico

</p>

    <hr>

    <div class="space-y-5">

        <div>
            <p class="text-sm text-gray-500">

💶 Importe total

</p>
            <p id="importeTotal" class="font-bold"></p>
        </div>

        <div>
            <p class="text-sm text-gray-500">

💳 Reserva pagada

</p>
            <p id="importeReserva"
               class="font-bold text-green-600"></p>
        </div>

        <div>
            <p class="text-sm text-gray-500">

💰 Pendiente de pago

</p>

            <p id="importePendiente"
               class="font-bold text-red-600"></p>
        </div>

    </div>

</div>

<div class="mt-10 flex justify-center gap-4">

<button

onclick="window.location='index.html'"

class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl">

Ir al Área Cliente

</button>

</div>

</div>

</div>

<script src="js/estados.js"></script>

<script src="js/estadoReserva.js"></script>

<script src="confirmacion.js"></script>

</body>

</html>
